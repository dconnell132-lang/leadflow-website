        - heading "LeadFlow started with a wrench in my hand." [level=1] [ref=f2e17]
        - paragraph [ref=f2e18]: Before I built LeadFlow, I worked as a plumber. That experience showed me how easily a great service business can lose its next customer simply because everyone is busy doing the work.
