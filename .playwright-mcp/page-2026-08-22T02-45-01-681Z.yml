    - generic [ref=f2e44]:
      - generic [ref=f2e45]:
        - generic [ref=f2e46]: From the field
        - heading "The problem I couldn’t stop thinking about." [level=2] [ref=f2e47]
      - generic [ref=f2e48]:
        - paragraph [ref=f2e49]: When your hands are on a job, you cannot always stop to answer the phone. But the person calling does not know that. They only know they need help—and if nobody responds, they may call the next business on the list.
        - paragraph [ref=f2e50]: I saw that good tradespeople were losing work for reasons that had nothing to do with the quality of their service. The calls, messages, and follow-up were simply too much to manage while running jobs and taking care of customers.
        - paragraph [ref=f2e51]: "That is what inspired me to build LeadFlow: a system that responds quickly, keeps the conversation moving, follows up, and helps turn interest into a booked appointment. It gives service businesses a reliable front line, even when the whole team is out in the field."
    - generic [ref=f2e53]:
      - generic [ref=f2e54]:
        - generic [ref=f2e55]: What guides us
        - heading "Built for the people who keep things running." [level=2] [ref=f2e56]
        - paragraph [ref=f2e57]: "LeadFlow is shaped by a simple idea: hardworking service businesses deserve technology that understands how their day actually works."
      - generic [ref=f2e58]:
        - generic [ref=f2e59]:
          - heading "Built around the real workday" [level=3] [ref=f2e66]
          - paragraph [ref=f2e67]: LeadFlow is designed for people who are driving, working with their hands, and taking care of customers—not sitting at a desk all day.
        - generic [ref=f2e68]:
          - heading "Technology that helps people" [level=3] [ref=f2e72]
          - paragraph [ref=f2e73]: The goal is not to replace the personal side of a service business. It is to make sure a good customer never gets ignored while the team is busy.
        - generic [ref=f2e74]:
          - heading "Every opportunity deserves a response" [level=3] [ref=f2e80]
          - paragraph [ref=f2e81]: A fast, thoughtful reply can be the difference between a missed call and a booked job. LeadFlow keeps that opportunity alive.
