      - generic [ref=f2e26]:
        - generic [ref=f2e27]: Why I built LeadFlow
        - blockquote [ref=f2e32]: “You shouldn’t have to choose between doing the job right and answering the next lead.”
        - generic [ref=f2e33]:
          - generic [ref=f2e39]:
            - generic [ref=f2e40]: Missed call
            - generic [ref=f2e41]: Opportunity still open
